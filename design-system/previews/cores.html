<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Cores</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../componentes.css">
<style>body{padding:24px;display:flex;flex-direction:column;gap:16px;max-width:760px}</style>
</head>
<body>
<style>.am{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.am div{border-radius:var(--raio);height:64px;display:flex;align-items:flex-end;padding:8px;font-size:var(--tam-xs);color:#fff;font-weight:600}.am .claro{color:var(--cor-tinta);border:1px solid var(--cor-linha)}</style>
<div class="am">
  <div style="background:var(--cor-tinta)">tinta</div>
  <div style="background:var(--cor-tinta-suave)">tinta-suave</div>
  <div class="claro" style="background:var(--cor-superficie)">superficie</div>
  <div class="claro" style="background:var(--cor-linha)">linha</div>
  <div style="background:var(--cor-destaque)">destaque</div>
  <div class="claro" style="background:var(--cor-destaque-suave)">destaque-suave</div>
  <div style="background:var(--cor-alerta)">alerta</div>
  <div class="claro" style="background:var(--cor-alerta-suave)">alerta-suave</div>
  <div style="background:var(--cor-mobilidade)">mobilidade</div>
  <div style="background:var(--cor-ativacao)">ativacao</div>
  <div style="background:var(--cor-principal)">principal</div>
  <div style="background:var(--cor-cardio)">cardio</div>
  <div style="background:var(--cor-finalizacao)">finalizacao</div>
</div>
</body>
</html>
